[tool_alias]
flutter = "asdf:https://github.com/nyuyuyu/asdf-flutter.git"

[tools]
flutter = "latest"
go = "1.23"
java = "temurin-21"
kotlin = "latest"
node = "lts"
python = "3.13"
ruby = "3.3.6"
rust = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = [
  "flutter",
  "go",
  "java",
  "node",
  "python",
  "ruby",
  "rust",
]

[env]
LDFLAGS = "-L/opt/homebrew/opt/openssl/lib -L/opt/homebrew/opt/libyaml/lib"
CPPFLAGS = "-I/opt/homebrew/opt/openssl/include -I/opt/homebrew/opt/libyaml/include"
PKG_CONFIG_PATH = "/opt/homebrew/opt/openssl/lib/pkgconfig:/opt/homebrew/opt/libyaml/lib/pkgconfig"
MISE_NODE_DEFAULT_PACKAGES_FILE = "~/.config/mise/nodejs"
