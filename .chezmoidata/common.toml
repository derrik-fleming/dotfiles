# Package sets shared by Homebrew and any future Linux package-manager scripts.
[packages.common]
# Arch package names for the portable CLI set above. Keep distro-specific
# naming here instead of teaching the installer to translate Homebrew formulae.
arch = [
  "act",
  "atuin",
  "bat",
  "btop",
  "chezmoi",
  "deno",
  "direnv",
  "fd",
  "fzf",
  "git",
  "github-cli",
  "golangci-lint",
  "httpie",
  "hurl",
  "jq",
  "just",
  "lazygit",
  "lsd",
  "mise",
  "pre-commit",
  "ripgrep",
  "starship",
  "tealdeer",
  "tree",
  "yazi",
  "zellij",
  "zoxide",
  "zsh",
]

# Debian package names for the portable CLI set. Some tools intentionally stay
# in packages.debian.optional because stable Debian may not package a current version.
debian = [
  "bat",
  "btop",
  "chezmoi",
  "direnv",
  "fd-find",
  "fzf",
  "gh",
  "git",
  "httpie",
  "jq",
  "ripgrep",
  "tree",
  "zsh",
]

tools = [
