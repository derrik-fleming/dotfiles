# Debian packages available from the standard Debian repositories.
[packages.debian]
apt = [
  "build-essential",
  "ca-certificates",
  "curl",
  "golang-go",
  "nodejs",
  "npm",
  "python3",
  "python3-pip",
  "unzip",
  "wget",
]

# Install these separately when the required version is not in the configured
# Debian release or repository. They are not installed by the bootstrap script.
optional = [
  "atuin",
  "docker",
  "lazygit",
  "mise",
  "starship",
  "yazi",
  "zellij",
  "zoxide",
]
